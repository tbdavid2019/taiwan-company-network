name: Build and Deploy

on:
  push:
    branches:
      - master
  workflow_dispatch:
  schedule:
    # Every Monday at 15:00 Asia/Taipei (07:00 UTC).
    - cron: '0 7 * * 1'

permissions:
  contents: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout 🛎️
        uses: actions/checkout@v4
        
      - name: Set up Python 3.11 🐍
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Update company data 📊
        run: python update.py

      - name: Set up Node.js 22 🟢
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install Node dependencies 📦
        run: npm ci

      - name: Generate listed-company aliases 🏷️
        run: npm run generate:aliases

      - name: Commit updated company data 🔄
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add public/data
          if git diff --cached --quiet; then
            echo "Company data is unchanged."
          else
            git commit -m "Auto-update company data [skip ci]"
            git push origin HEAD:master
          fi

      - name: Test and build website 🧪
        run: |
          npm test
          npm run build

      - name: Deploy website to GitHub Pages 🚀
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git remote set-url origin "https://git:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          npm run deploy -- -u "github-actions-bot <support+actions@github.com>"
